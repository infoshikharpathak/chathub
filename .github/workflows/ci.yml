name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The model, FoodDash's agent and Ironclad's search are stubbed: no secrets needed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches the Docker image
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          OPENAI_API_KEY: dummy-key-for-ci
        run: pytest -q

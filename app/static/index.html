<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Hub</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#5b6470; --card:#fff; --line:#dde1e6; --accent:#2f5fd0; --warn:#b4471b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171b; --fg:#e7eaee; --muted:#9aa3ad; --card:#1d2127; --line:#2d333b; --accent:#7aa2ff; --warn:#ff9a6b; } }
  * { box-sizing:border-box } body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; height:100vh; }
  h1 { font-size:18px; margin:4px 0 12px } #log { flex:1; overflow:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:8px }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; white-space:pre-wrap }
  .user { align-self:flex-end; max-width:85%; border-color:var(--accent) } .bot { align-self:flex-start; max-width:95% }
  .meta { margin-top:6px; font-size:12px; color:var(--muted) } .meta a { color:var(--accent) } .blocked { color:var(--warn) }
  form { display:flex; gap:8px } input { flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit }
  button { padding:10px 16px; border-radius:8px; border:0; background:var(--accent); color:#fff; font:inherit; cursor:pointer } button:disabled { opacity:.5 }
</style>
</head>
<body>
<main>
  <h1>Chat Hub</h1>
  <div id="log"></div>
  <form id="f"><input id="m" placeholder="Ask about food or Ironclad's policies" autocomplete="off" required><button>Send</button></form>
</main>
<script>
const log = document.getElementById('log'), form = document.getElementById('f'), input = document.getElementById('m');
let sessionId = null, dashboard = '';
fetch('/config').then(r => r.json()).then(c => { dashboard = c.dashboard_url || ''; }).catch(() => {});
function traceLink(app, id) {
  if (!id) return document.createTextNode(app);
  if (!dashboard) { const s = document.createElement('span'); s.textContent = `${app} (${id.slice(0, 8)})`; return s; }
  const a = document.createElement('a'); a.href = `${dashboard}/ui/apps/${app}/traces/${id}`; a.target = '_blank';
  a.textContent = `${app} ${id.slice(0, 8)}`; return a;
}
function add(cls, text, data) {
  const div = document.createElement('div'); div.className = `msg ${cls}`; div.textContent = text;
  if (data) {
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.append('Trace: ', traceLink('chathub', data.trace_id));
    const apps = data.calls || [];
    meta.append(apps.length ? ' · Called: ' : ' · No other apps called');
    apps.forEach((c, i) => {
      if (i) meta.append(', ');
      const span = document.createElement('span');
      span.append(`${c.tool} → `, traceLink(c.app, c.trace_id));
      if (c.violation) { const b = document.createElement('span'); b.className = 'blocked'; b.textContent = ` (blocked: ${c.violation})`; span.append(b); }
      meta.append(span);
    });
    div.append(meta);
  }
  log.append(div); log.scrollTop = log.scrollHeight;
}
form.addEventListener('submit', async (e) => {
  e.preventDefault(); const text = input.value.trim(); if (!text) return;
  add('user', text); input.value = ''; form.querySelector('button').disabled = true;
  try {
    const r = await fetch('/agent/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.status);
    sessionId = data.session_id; add('bot', data.response, data);
  } catch (err) { add('bot', `Error: ${err.message}`); }
  finally { form.querySelector('button').disabled = false; input.focus(); }
});
</script>
</body>
</html>
